<!doctype html><html lang="zh"><meta charset="utf-8"><title>Week 4 CSV 清理工作台</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>body{font:17px/1.5 Arial;margin:28px;color:#24343d}button{font:16px Arial;padding:10px;margin:6px 6px 6px 0}pre{font:14px/1.5 Menlo;background:#f2f6f7;padding:16px;max-height:240px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:6px;border:1px solid #ccd6d9}th{background:#176579;color:white}aside{font-size:14px}h1{font-size:27px}#view{overflow:auto;max-height:430px}</style><h1>Week 4 CSV 清理工作台</h1><aside>本教程提供的辅助工具，非 Excel。选择的公开 CSV 仅在浏览器内处理，不会上传至服务器。</aside><p><label>1 选择原始 API CSV <input id="file" type="file" accept=".csv"></label></p><div><button id="trim" disabled>2 去掉说明行和空行</button><button id="cols" disabled>3 只保留国家 代码 2023</button><button id="rows" disabled>4 只保留十个国家</button><button id="names" disabled>5 改表头并加入年份列</button><button id="save" disabled>6 验证并下载 internet.csv</button></div><p id="status">等待选择下载包中 API_ 开头的主数据 CSV，不选 Metadata 文件。</p><div id="view"></div><p id="audit"></p><script>
let data=[],stage=0;const codes=['AUS','BRA','CHN','GBR','IND','JPN','KEN','NGA','USA','ZAF'];
const $=id=>document.getElementById(id);
function show(message){$('status').textContent=message;const v=$('view');v.replaceChildren();let table=document.createElement('table');data.slice(0,12).forEach((row,i)=>{let tr=document.createElement('tr');row.forEach(value=>{let td=document.createElement(i===0&&stage>0?'th':'td');td.textContent=value;tr.appendChild(td)});table.appendChild(tr)});v.appendChild(table)}
$('file').onchange=async()=>{try{data=Papa.parse(await $('file').files[0].text(),{skipEmptyLines:false}).data;stage=0;$('trim').disabled=false;['cols','rows','names','save'].forEach(id=>$(id).disabled=true);show('原始文件已加载。顶部有 Data Source、更新时间与空行；下面才是 Country Name 表头。横向滚动查看历年列。')}catch(e){$('status').textContent='读取失败：'+e.message}};
$('trim').onclick=()=>{const start=data.findIndex(r=>r[0]==='Country Name'&&r[1]==='Country Code');if(start<0){$('status').textContent='没有找到表头，请选择 API_ 主数据 CSV';return}data=data.slice(start).filter(r=>r.some(v=>v.trim()!==''));stage=1;$('cols').disabled=false;$('trim').disabled=true;show('已删除表头前说明与空行。数据记录 '+(data.length-1)+' 条。首行现在是列名。')};
$('cols').onclick=()=>{let h=data[0],ix=['Country Name','Country Code','2023'].map(n=>h.indexOf(n));if(ix.includes(-1)){return}data=data.map(r=>ix.map(i=>r[i]));stage=2;$('rows').disabled=false;$('cols').disabled=true;show('保留三列：Country Name、Country Code、2023。其他年份、指标列及末尾空列已移除。')};
$('rows').onclick=()=>{data=[data[0],...data.slice(1).filter(r=>codes.includes(r[1]))];stage=3;$('names').disabled=false;$('rows').disabled=true;show('按代码保留十个国家：'+codes.join(' ')+'。统一使用 2023 年，不使用各国不同的最新年份。')};
$('names').onclick=()=>{data=[['Country','CountryCode','Year','InternetUsersPercent'],...data.slice(1).map(r=>[r[0],r[1],'2023',r[2]])];stage=4;$('save').disabled=false;$('names').disabled=true;show('已形成四列表头，无空格。年份明确写为 2023，原始数值未四舍五入。')};
$('save').onclick=()=>{let rows=data.slice(1);let ok=rows.length===10&&new Set(rows.map(r=>r[1])).size===10&&rows.every(r=>r.length===4&&r.every(v=>v.trim()!=='')&&r[2]==='2023'&&Number.isFinite(Number(r[3]))&&Number(r[3])>=0&&Number(r[3])<=100);if(!ok){$('audit').textContent='验证失败：请检查行数、空值或数值范围，不要把缺失值当成 0。';return}let csv=Papa.unparse(data,{newline:'\n'})+'\n';let a=document.createElement('a');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='internet.csv';a.click();URL.revokeObjectURL(u);$('audit').textContent='验证通过：1 行表头 + 10 行数据；4 列；无空值、无重复国家；所有占比在 0–100。internet.csv 已下载。';show('完成清理。下载的 internet.csv 就是后面网页要读取的文件。')};
</script></html>
